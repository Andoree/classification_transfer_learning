[INPUT]
INPUT_DIR=../../data/smm4h_21_data/post_eval/ru
DRUG_EMBEDDINGS_FROM=chemberta
[PARAMETERS]
MAX_TEXT_LENGTH=128
MAX_MOLECULE_LENGTH=256
BATCH_SIZE=64
LEARNING_RATE=3e-5
DROPOUT=0.3
NUM_EPOCHS=10
APPLY_UPSAMPLING=no
USE_WEIGHTED_LOSS=no
FREEZE_LAYER_COUNT=5
FREEZE_EMBEDDINGS_LAYER=True
# -1
LOSS_WEIGHT=-1.0
# nodrug/drug/attention/concat/drug_attention
MODEL_TYPE=drug
TEXT_ENCODER_NAME=cimm-kzn/enrudr-bert
#cimm-kzn/enrudr-bert,camembert/camembert-base
# random/first
DRUG_SAMPLING=first
USE_ATC_CODES=no
MASK_DRUG=no
# en_drug_tokens.txt
DRUG_DICT_PATH=../../data/drug_dicts/en_drug_tokens.txt
# ../../data/additional_data/features
DRUG_FEATURES_PATH=../../data/additional_data/features/atc_drugs.txt
[UPSAMPLING]
UPSAMPLING_WEIGHT=-1.0
[CROSSATT_PARAM]
CROSSATT_DROPOUT=0.1
CROSSATT_HIDDEN_DROPOUT=0.1

[OUTPUT]
OUTPUT_DIR=results/ru_tuning_drug
EVALUATION_FILENAME=evaluation.txt

