[INPUT]
INPUT_DIR=../../data/smm4h_2020_data/fr/preprocessed
DRUG_EMBEDDINGS_FROM=chemberta
[PARAMETERS]
MAX_TEXT_LENGTH=128
MAX_MOLECULE_LENGTH=256
BATCH_SIZE=64
LEARNING_RATE=3e-5
DROPOUT=0.3
NUM_EPOCHS=10
APPLY_UPSAMPLING=no
USE_WEIGHTED_LOSS=no
FREEZE_LAYER_COUNT=0
FREEZE_EMBEDDINGS_LAYER=no
# -1
LOSS_WEIGHT=3.0
# nodrug/drug/attention/concat/drug_attention
MODEL_TYPE=drug
TEXT_ENCODER_NAME=camembert/camembert-base
#cimm-kzn/enrudr-bert
# random/first
DRUG_SAMPLING=first
USE_ATC_CODES=no
MASK_DRUG=no
# en_drug_tokens.txt
DRUG_DICT_PATH=../../data/drug_dicts/en_drug_tokens.txt
[UPSAMPLING]
UPSAMPLING_WEIGHT=-1.0
[CROSSATT_PARAM]
CROSSATT_DROPOUT=0.1
CROSSATT_HIDDEN_DROPOUT=0.1

[OUTPUT]
OUTPUT_DIR=results/smm4h_2020/fr_tuning
EVALUATION_FILENAME=evaluation.txt

