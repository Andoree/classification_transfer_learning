[INPUT]
INPUT_DIR=../../data/smm4h_21_data/post_eval/ru
DRUG_EMBEDDINGS_FROM=chemberta
[PARAMETERS]
MAX_TEXT_LENGTH=128
MAX_MOLECULE_LENGTH=256
BATCH_SIZE=64
LEARNING_RATE=3e-5
DROPOUT=0.3
NUM_EPOCHS=10
APPLY_UPSAMPLING=yes
USE_WEIGHTED_LOSS=no
FREEZE_LAYER_COUNT=5
FREEZE_EMBEDDINGS_LAYER=yes
# -1
LOSS_WEIGHT=3.0
# nodrug/drug/attention/concat/drug_attention
MODEL_TYPE=drug

TEXT_ENCODER_NAME=cimm-kzn/enrudr-bert
#cimm-kzn/enrudr-bert
# random/first
DRUG_SAMPLING=first
USE_ATC_CODES=no
[UPSAMPLING]
UPSAMPLING_WEIGHT=-1.0
[CROSSATT_PARAM]
CROSSATT_DROPOUT=0.1
CROSSATT_HIDDEN_DROPOUT=0.1

[OUTPUT]
OUTPUT_DIR=results/ru_tuning
EVALUATION_FILENAME=evaluation.txt

