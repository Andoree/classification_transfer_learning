[INPUT]
INPUT_DIR=../../data/smm4h_21_data/en_new/w_smiles
DRUG_EMBEDDINGS_FROM=chemberta
[PARAMETERS]
MAX_TEXT_LENGTH=128
MAX_MOLECULE_LENGTH=256
BATCH_SIZE=32
LEARNING_RATE=1e-5
DROPOUT=0.3
NUM_EPOCHS=10
APPLY_UPSAMPLING=no
USE_WEIGHTED_LOSS=yes
FREEZE_LAYER_COUNT=10
FREEZE_EMBEDDINGS_LAYER=yes
# -1
LOSS_WEIGHT=2.0
# nodrug/drug/attention/concat/drug_attention
MODEL_TYPE=drug
TEXT_ENCODER_NAME=roberta-large
#cimm-kzn/enrudr-bert
# random/first
DRUG_SAMPLING=first
USE_ATC_CODES=no
MASK_DRUG=yes
# en_drug_tokens.txt
DRUG_DICT_PATH=../../data/drug_dicts/en_drug_tokens.txt
[UPSAMPLING]
UPSAMPLING_WEIGHT=-1.0
[CROSSATT_PARAM]
CROSSATT_DROPOUT=0.1
CROSSATT_HIDDEN_DROPOUT=0.1

[OUTPUT]
OUTPUT_DIR=results/en_tuning_3
EVALUATION_FILENAME=evaluation.txt

